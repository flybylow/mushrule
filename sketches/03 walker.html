<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>walker — two forward, one left</title>
<style>
  :root{
    --kiln:#1b1a17; --panel:#232019; --line:#3a352c;
    --bone:#e9e2d0; --ash:#8a8272; --ember:#c66b3d; --empty:#252119;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--kiln);color:var(--bone);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
  body{max-width:460px;margin:0 auto;padding:22px 18px 40px}
  h1{font-size:15px;font-weight:600;margin:0 0 14px}

  /* the recipe */
  .recipe{display:flex;align-items:center;gap:8px;margin:0 0 20px;
    font-size:12px;color:var(--ash)}
  .recipe .steps{display:flex;gap:5px}
  .mv{width:26px;height:26px;border:1px solid var(--line);border-radius:3px;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ash)}
  .mv.on{border-color:var(--ember);color:var(--ember)}
  .recipe .rep{color:var(--ash);font-size:16px}

  /* grid */
  #board{display:grid;gap:2px;background:var(--panel);border:1px solid var(--line);
    border-radius:3px;padding:8px;aspect-ratio:1;width:100%}
  .c{background:var(--empty);border-radius:2px}
  .c.trail{background:var(--bone)}
  .c.head{background:var(--ember)}

  .caption{text-align:center;font-size:12px;color:var(--ash);min-height:1.4em;margin:14px 0 0}
  .caption b{color:var(--ember)}

  .btns{display:flex;gap:9px;margin-top:18px}
  button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--bone);
    font:inherit;font-size:14px;padding:12px;border-radius:3px;cursor:pointer}
  button.primary{border-color:var(--ember);color:var(--ember)}
  button:active{background:var(--line)}
</style>
</head>
<body>

<h1>two forward, one left</h1>

<div class="recipe">
  <span>recipe:</span>
  <div class="steps" id="recipe"></div>
  <span class="rep">↻ repeat</span>
</div>

<div id="board"></div>
<p class="caption" id="cap">The dot starts here. Tap <b>step</b> to move it.</p>

<div class="btns">
  <button id="reset">reset</button>
  <button id="play">play</button>
  <button id="step" class="primary">step →</button>
</div>

<script>
(() => {
  const N = 15;                                   // grid size
  const board = document.getElementById('board');
  const cap = document.getElementById('cap');
  board.style.gridTemplateColumns = `repeat(${N},1fr)`;

  // build cells
  const cells = [];
  for (let i=0;i<N*N;i++){ const d=document.createElement('div'); d.className='c'; board.appendChild(d); cells.push(d); }

  // the recipe: up, up, left  (two forward, one left)
  const MOVES = [ {dx:0,dy:-1,g:'↑'}, {dx:0,dy:-1,g:'↑'}, {dx:-1,dy:0,g:'←'} ];
  const recEl = document.getElementById('recipe');
  MOVES.forEach(m=>{ const s=document.createElement('div'); s.className='mv'; s.textContent=m.g; recEl.appendChild(s); });

  let x, y, i, trail, timer=null;

  function idx(x,y){ return y*N+x; }
  function paint(){
    cells.forEach(c=>c.className='c');
    trail.forEach(p=>cells[idx(p.x,p.y)].classList.add('trail'));
    cells[idx(x,y)].classList.add('head');
    [...recEl.children].forEach((s,k)=>s.classList.toggle('on',k===(i%MOVES.length)));
  }
  function reset(){
    stop();
    x=N-2; y=N-2; i=0;                            // start near bottom-right, room to go up-left
    trail=[{x,y}];
    cap.innerHTML='The dot starts here. Tap <b>step</b> to move it.';
    paint();
  }
  function step(){
    const m = MOVES[i%MOVES.length];
    const nx=x+m.dx, ny=y+m.dy;
    if(nx<0||ny<0||nx>=N||ny>=N){ cap.innerHTML='Reached the edge — the path is done. It draws the <b>same staircase every time.</b>'; stop(); return false; }
    x=nx; y=ny; i++;
    trail.push({x,y});
    cap.innerHTML='Move <b>'+m.g+'</b> · '+trail.length+' cells drawn so far.';
    paint();
    return true;
  }
  function stop(){ if(timer){clearInterval(timer);timer=null;} document.getElementById('play').textContent='play'; }

  document.getElementById('step').onclick = step;
  document.getElementById('reset').onclick = reset;
  document.getElementById('play').onclick = () => {
    if(timer){ stop(); return; }
    document.getElementById('play').textContent='pause';
    timer=setInterval(()=>{ if(!step()) stop(); }, 260);
  };

  reset();
})();
</script>
</body>
</html>
