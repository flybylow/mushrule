<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>one mark, one rule</title>
<style>
  :root{
    --kiln:#1b1a17; --panel:#232019; --line:#3a352c;
    --bone:#e9e2d0; --ash:#8a8272; --ember:#c66b3d; --dead:#2a271f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--kiln);color:var(--bone);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
  body{max-width:520px;margin:0 auto;padding:22px 18px 40px}
  h1{font-size:15px;font-weight:600;margin:0 0 4px}
  .rule{font-size:13px;color:var(--ash);line-height:1.5;margin:0 0 22px;
    border-left:2px solid var(--ember);padding-left:11px}
  .rule b{color:var(--bone)}

  #grid{display:flex;flex-direction:column;gap:6px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:3px;
    padding:16px 10px;min-height:80px}
  .grow{display:flex;gap:6px}
  .cell{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    font-size:15px;border-radius:50%;transition:transform .15s ease}
  .cell.x{background:var(--bone);color:var(--kiln);font-weight:700}
  .cell.o{border:1px solid #4a453b;color:#5c5648}
  .grow.new .cell{animation:pop .25s ease}
  @keyframes pop{from{transform:scale(.4);opacity:.3}to{transform:scale(1);opacity:1}}

  .caption{text-align:center;font-size:12px;color:var(--ash);min-height:1.4em;margin:12px 0 0}
  .caption b{color:var(--ember)}

  .btns{display:flex;gap:10px;margin-top:20px}
  button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--bone);
    font:inherit;font-size:14px;padding:13px;border-radius:3px;cursor:pointer}
  button.primary{border-color:var(--ember);color:var(--ember)}
  button:active{background:var(--line)}
  button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>

<h1>one mark, one rule</h1>
<p class="rule">Rule: a cell becomes <b>×</b> if <b>either</b> neighbour above it is <b>×</b>.<br>
Otherwise it stays <b>o</b> (empty).</p>

<div id="grid"></div>
<p class="caption" id="cap">One filled cell to start. Tap <b>add next row</b>.</p>

<div class="btns">
  <button id="reset">reset</button>
  <button id="step" class="primary">add next row →</button>
</div>

<script>
(() => {
  const W = 11;                          // narrow grid, easy to follow
  const gridEl = document.getElementById('grid');
  const cap = document.getElementById('cap');
  let rows = [];

  function seed(){ const r = new Array(W).fill(0); r[(W-1)/2] = 1; return r; }

  function next(prev){
    return prev.map((_,i) => {
      const l = prev[i-1] || 0, rt = prev[i+1] || 0;
      return (l || rt) ? 1 : 0;           // becomes × if either neighbour is ×
    });
  }

  function render(){
    gridEl.innerHTML = '';
    rows.forEach((row,y) => {
      const rEl = document.createElement('div');
      rEl.className = 'grow' + (y === rows.length-1 && rows.length>1 ? ' new' : '');
      row.forEach(c => {
        const cEl = document.createElement('div');
        cEl.className = 'cell ' + (c ? 'x' : 'o');
        cEl.textContent = c ? '×' : 'o';
        rEl.appendChild(cEl);
      });
      gridEl.appendChild(rEl);
    });
  }

  function reset(){
    rows = [seed()];
    cap.innerHTML = 'One filled cell to start. Tap <b>add next row</b>.';
    document.getElementById('step').disabled = false;
    render();
  }

  document.getElementById('step').onclick = () => {
    if (rows.length >= W) { cap.innerHTML = 'Full. The rule always draws the <b>same triangle</b> — tap reset to run it again.'; return; }
    const before = rows[rows.length-1].reduce((a,b)=>a+b,0);
    rows.push(next(rows[rows.length-1]));
    const after = rows[rows.length-1].reduce((a,b)=>a+b,0);
    cap.innerHTML = 'The × spread outward by one. Row now has <b>' + after + '</b> filled cells (was ' + before + ').';
    if (rows.length >= W) document.getElementById('step').disabled = true;
    render();
  };

  document.getElementById('reset').onclick = reset;
  reset();
})();
</script>
</body>
</html>
